name: bot-ci
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sanity-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAFE_MODE: "1"
      PAPER_MODE: "1"
      TELEGRAM_ENABLED: "0"
      PAPER_SYNC_BALANCE: "0"
      RUN_ONLINE_CHECKS: "0"
      BYBIT_API_KEY: ""
      BYBIT_API_SECRET: ""
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      DATA_ROOT: "${{ runner.temp }}/bot-data"
      LOG_JSONL: "${{ runner.temp }}/bot-data/bot_cycle_log.jsonl"
      MANAGED_POSITIONS_FILE: "${{ runner.temp }}/bot-data/managed_positions.json"
      MPLCONFIGDIR: "${{ runner.temp }}/matplotlib"
      PYTHONIOENCODING: "UTF-8"
      SUBPROC_ENCODING: "UTF-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (if needed)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy

      - name: Python syntax
        run: |
          python -m compileall -q .

      - name: Lint (ruff)
        continue-on-error: true
        run: |
          python -m ruff check .

      - name: Type check (mypy)
        continue-on-error: true
        run: |
          python -m mypy .

      - name: Create data dirs
        run: |
          mkdir -p "$DATA_ROOT"
          mkdir -p "$MPLCONFIGDIR"

      - name: Full test suite
        run: |
          python -m pytest -q

      - name: Sanity check
        run: |
          python sanity_check.py

      - name: Offline paper smoke
        run: |
          python -m pytest -q \
            tests/test_position_lifecycle_integration.py::test_paper_lifecycle_never_calls_real_trading_endpoints
